<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Cadastro - Onde Tem?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        .main-tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }

        .main-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: #666;
        }

        .main-tab.active {
            color: #007bff;
            border-bottom: 2px solid #007bff;
            margin-bottom: -2px;
        }

        .tipo-selector {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .tipo-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            background: #e9ecef;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .tipo-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .tipo-btn:first-child {
            border-radius: 4px 0 0 4px;
        }

        .tipo-btn:last-child {
            border-radius: 0 4px 4px 0;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            color: #666;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .company-field {
            display: none;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        #resultado {
            margin-top: 15px;
            font-size: 12px;
            word-break: break-all;
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="main-tabs">
            <div class="main-tab active" id="tabLoginBtn" onclick="alternarAba('login')">Entrar</div>
            <div class="main-tab" id="tabCadastroBtn" onclick="alternarAba('cadastro')">Cadastrar</div>
        </div>

        <!-- Seção de Login -->
        <div id="sectionLogin" class="form-section active">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Usuário:</label>
                    <input type="text" id="loginUsername" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Senha:</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <!-- Seção de Cadastro -->
        <div id="sectionCadastro" class="form-section">
            <h2>Criar Conta</h2>
            <div class="tipo-selector">
                <div class="tipo-btn active" id="btnUsuario" onclick="mudarTipoCadastro('usuario')">Usuário</div>
                <div class="tipo-btn" id="btnEmpresa" onclick="mudarTipoCadastro('empresa')">Empresa</div>
            </div>

            <form id="cadastroForm">
                <div class="form-group">
                    <label for="cadUsername">Nome de Usuário:</label>
                    <input type="text" id="cadUsername" required>
                </div>
                <div class="form-group">
                    <label for="cadEmail">E-mail:</label>
                    <input type="email" id="cadEmail" required>
                </div>
                <div class="form-group">
                    <label for="cadPassword">Senha:</label>
                    <input type="password" id="cadPassword" required>
                </div>

                <div class="form-group company-field">
                    <label for="cadRazaoSocial">Razão Social:</label>
                    <input type="text" id="cadRazaoSocial">
                </div>
                <div class="form-group company-field">
                    <label for="cadCnpj">CNPJ:</label>
                    <input type="text" id="cadCnpj">
                </div>

                <button type="submit" style="background-color: #28a745;">Cadastrar</button>
            </form>
        </div>

        <div id="resultado"></div>
    </div>

    <script>
        const API_URL = 'https://onde-tem-back-end.onrender.com';
        const resultadoDiv = document.getElementById('resultado');
        let tipoCadastroAtual = 'usuario';

        function alternarAba(aba) {
            resultadoDiv.style.display = 'none';
            if (aba === 'login') {
                document.getElementById('tabLoginBtn').classList.add('active');
                document.getElementById('tabCadastroBtn').classList.remove('active');
                document.getElementById('sectionLogin').classList.add('active');
                document.getElementById('sectionCadastro').classList.remove('active');
            } else {
                document.getElementById('tabCadastroBtn').classList.add('active');
                document.getElementById('tabLoginBtn').classList.remove('active');
                document.getElementById('sectionCadastro').classList.add('active');
                document.getElementById('sectionLogin').classList.remove('active');
            }
        }

        function mudarTipoCadastro(tipo) {
            tipoCadastroAtual = tipo;
            const companyFields = document.querySelectorAll('.company-field');
            if (tipo === 'usuario') {
                document.getElementById('btnUsuario').classList.add('active');
                document.getElementById('btnEmpresa').classList.remove('active');
                companyFields.forEach(el => el.style.display = 'none');
            } else {
                document.getElementById('btnEmpresa').classList.add('active');
                document.getElementById('btnUsuario').classList.remove('active');
                companyFields.forEach(el => el.style.display = 'block');
            }
        }

        // Manipular Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            resultadoDiv.style.display = 'block';
            resultadoDiv.style.color = '#333';
            resultadoDiv.innerText = 'Autenticando...';

            try {
                const response = await fetch(`${API_URL}/api/token/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok) {
                    resultadoDiv.style.color = 'green';
                    resultadoDiv.innerHTML = `<strong>Login com sucesso! Token:</strong><br>${data.access}`;
                } else {
                    resultadoDiv.style.color = 'red';
                    resultadoDiv.innerText = `Erro (${response.status}): Usuário ou senha inválidos.`;
                }
            } catch (error) {
                resultadoDiv.style.color = 'red';
                resultadoDiv.innerText = `Erro de conexão: ${error.message}`;
            }
        });

        // Manipular Cadastro
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('cadUsername').value;
            const email = document.getElementById('cadEmail').value;
            const password = document.getElementById('cadPassword').value;

            let dadosEnvio = { username, email, password, tipo: tipoCadastroAtual };

            if (tipoCadastroAtual === 'empresa') {
                dadosEnvio.razao_social = document.getElementById('cadRazaoSocial').value;
                dadosEnvio.cnpj = document.getElementById('cadCnpj').value;
            }

            resultadoDiv.style.display = 'block';
            resultadoDiv.style.color = '#333';
            resultadoDiv.innerText = 'Processando cadastro...';

            const endpoint = tipoCadastroAtual === 'usuario'
                ? `${API_URL}/api/cadastro/usuario/`
                : `${API_URL}/api/cadastro/empresa/`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosEnvio)
                });
                const data = await response.json();

                if (response.ok) {
                    resultadoDiv.style.color = 'green';
                    resultadoDiv.innerText = 'Cadastro realizado com sucesso! Faça login agora.';
                } else {
                    resultadoDiv.style.color = 'red';
                    resultadoDiv.innerText = `Erro (${response.status}): ${JSON.stringify(data)}`;
                }
            } catch (error) {
                resultadoDiv.style.color = 'red';
                resultadoDiv.innerText = `Erro de conexão: ${error.message}`;
            }
        });
    </script>
</body>

</html>
